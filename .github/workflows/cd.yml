name: CD

on:
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy · web (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (production)
        # Run from repo root, not apps/web — the linked Vercel project's Root
        # Directory setting is already "apps/web", so cd-ing there first
        # doubles the path (apps/web/apps/web does not exist).
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --token="$VERCEL_TOKEN" --prod --yes

  deploy-api:
    name: Deploy · api (Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API service
        # Run from repo root, not apps/api — the Railway service's Root
        # Directory is already "apps/api", so it expects a full-repo archive
        # and looks for apps/api/Dockerfile within it. Uploading from inside
        # apps/api instead ships Dockerfile at the archive root, which the
        # service can't find at its configured path.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --detach

  deploy-workers:
    name: Deploy · workers (Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy Workers service
        # Same reasoning as deploy-api: run from repo root so the archive
        # matches what the service's Root Directory setting expects.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service worker --detach
