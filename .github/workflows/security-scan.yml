name: Security Scan

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not the :latest tag — same reasoning as the
      # trivy-action pin below: a mutable Docker Hub tag can be silently
      # re-pushed. Digest captured directly via `docker pull` + `docker
      # inspect`, not a third-party lookup.
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/react \
            --config=p/nodejsscan \
            --exclude-rule=ajinabraham.njsscan.dos.regex_dos.regex_dos \
            --exclude-rule=ajinabraham.njsscan.crypto.crypto_node.node_insecure_random_generator \
            --exclude-rule=ajinabraham.njsscan.crypto.timing_attack_node.node_timing_attack \
            --exclude-rule=ajinabraham.njsscan.generic.hardcoded_secrets.node_secret \
            --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude="**/node_modules/**" \
            --exclude="**/dist/**" \
            --exclude="**/.next/**" \
            --exclude="**/coverage/**" \
            --exclude="apps/web/public/**" \
            --exclude="supabase/email-templates/**" \
            --exclude="**/*.spec.ts" \
            --exclude="**/*.e2e-spec.ts" \
            --error \
            --metrics=off

  trivy-deps:
    name: Dependency scan · Trivy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/web, apps/api, apps/workers, apps/emails, packages/monitoring]
    steps:
      - uses: actions/checkout@v4
      - name: Report HIGH + CRITICAL (informational — tracked separately via Dependabot)
        # Pinned by commit SHA, not a mutable tag — trivy-action had its
        # version tags force-pushed to credential-stealing malware in a
        # March 2026 supply chain attack (GHSA-69fq-xp46-6x23). This SHA is
        # the commit behind the v0.36.0 tag, verified via GitHub's API with
        # a valid signature dated after the incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.app }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Fail only on CRITICAL
        # Pinned by commit SHA, not a mutable tag — trivy-action had its
        # version tags force-pushed to credential-stealing malware in a
        # March 2026 supply chain attack (GHSA-69fq-xp46-6x23). This SHA is
        # the commit behind the v0.36.0 tag, verified via GitHub's API with
        # a valid signature dated after the incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.app }}
          scanners: vuln
          severity: CRITICAL
          exit-code: 1

  trivy-config:
    name: IaC/Dockerfile scan · Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfiles and compose files
        # Pinned by commit SHA, not a mutable tag — trivy-action had its
        # version tags force-pushed to credential-stealing malware in a
        # March 2026 supply chain attack (GHSA-69fq-xp46-6x23). This SHA is
        # the commit behind the v0.36.0 tag, verified via GitHub's API with
        # a valid signature dated after the incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
